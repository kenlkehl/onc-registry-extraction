[project]
name = "naaccr-pipeline"
version = "0.1.0"
description = "NAACCR v26 cancer registry abstraction pipeline using local LLMs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "httpx>=0.25",
    "tenacity>=8.0",
    "pydantic>=2.0",
    "lxml>=4.9",
    "rapidfuzz>=3.0",
    "tqdm>=4.60",
    "pyarrow"
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
naaccr-pipeline = "naaccr_pipeline.main:main"
naaccr-convert = "naaccr_pipeline.convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["naaccr_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["naaccr_pipeline/tests"]
