[project]
name = "onc-registry-pipeline"
version = "0.1.0"
description = "Oncology registry NAACCR v26 abstraction pipeline using local LLMs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "httpx>=0.25",
    "tenacity>=8.0",
    "pydantic>=2.0",
    "lxml>=4.9",
    "rapidfuzz>=3.0",
    "tqdm>=4.60",
    "pyarrow"
]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
onc-registry-pipeline = "onc_registry_pipeline.main:main"
onc-registry-convert = "onc_registry_pipeline.convert:main"
onc-registry-compress-notes = "onc_registry_pipeline.compress_notes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onc_registry_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["onc_registry_pipeline/tests"]
